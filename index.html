<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halo 管理系统</title>
<script src="auth.js?v=2"></script>
<script>try{Auth.guard("staff")}catch(e){location.replace("login.html")}</script>
<style>
  :root{
    --navy:#0B2447; --navy2:#0F2E5A; --gold:#D4A24C; --cream:#F5F1E8;
    --ink:#1F2937; --line:#E3DECF; --muted:#8A8678;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    background:var(--cream);color:var(--ink);min-height:100vh}
  .top{background:var(--navy);padding:40px 24px 48px;text-align:center}
  .top .logo{color:var(--gold);font-size:30px;font-weight:700;letter-spacing:2px}
  .top .sub{color:#9DB4D4;font-size:14px;margin-top:8px}
  .wrap{max-width:920px;margin:0 auto;padding:0 20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:-28px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 24px;
    text-decoration:none;color:var(--ink);transition:.15s;display:block;box-shadow:0 4px 16px rgba(11,36,71,.06)}
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(11,36,71,.12)}
  .card .ico{width:48px;height:48px;border-radius:12px;background:var(--navy);color:var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:16px}
  .card.live .ico{background:var(--gold);color:var(--navy)}
  .card .t{font-size:18px;font-weight:600}
  .card .d{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.5}
  .card .tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px;margin-top:12px}
  .tag.on{background:#E1F5EE;color:#1D9E75}
  .tag.soon{background:#F1EFE8;color:var(--muted)}
  .foot{text-align:center;color:var(--muted);font-size:12px;padding:40px 20px}
  .sec{font-size:13px;color:var(--muted);font-weight:600;margin:34px 4px 4px;letter-spacing:.5px}
</style>
</head>
<body>
  <div class="top">
    <div class="logo">HALO</div>
    <div class="sub">内部管理系统 · Internal System</div>
  </div>
  <div class="wrap">
    <div class="sec">日常运营</div>
    <div class="grid">
      <a class="card live" href="pos.html">
        <div class="ico">🛒</div>
        <div class="t">销售录入</div>
        <div class="d">店员逐单记录交易、收款、客人来意</div>
        <span class="tag on">可用</span>
      </a>
      <a class="card live" href="dashboard.html" data-role="boss">
        <div class="ico">📊</div>
        <div class="t">老板总览</div>
        <div class="d">九店业绩一屏看完 · 实时汇总</div>
        <span class="tag on">可用</span>
      </a>
    </div>

    <div class="sec">财务</div>
    <div class="grid">
      <a class="card" href="#" onclick="alert('发票系统:之后把现有的发票工具传进来,首页加一个按钮即可');return false;">
        <div class="ico">🧾</div>
        <div class="t">发票系统</div>
        <div class="d">开发票、对账、存 Google Sheet</div>
        <span class="tag soon">待接入</span>
      </a>
      <a class="card" href="#" onclick="alert('报销Claim:你已经做好了,之后传进来,首页加按钮');return false;">
        <div class="ico">💰</div>
        <div class="t">报销 Claim</div>
        <div class="d">团队在线报销、HQ 审核</div>
        <span class="tag soon">待接入</span>
      </a>
    </div>

    <div class="sec">未来模块</div>
    <div class="grid">
      <a class="card" href="#" onclick="alert('库存进货:之后开发');return false;">
        <div class="ico">📦</div>
        <div class="t">库存进货</div>
        <div class="d">进货录入、各店库存、低库存提醒</div>
        <span class="tag soon">规划中</span>
      </a>
      <a class="card live" href="attendance.html">
        <div class="ico">🕐</div>
        <div class="t">考勤排班</div>
        <div class="d">排休、请假申请 · 提交给 HQ</div>
        <span class="tag on">可用</span>
      </a>
    </div>
  </div>
  <div class="foot">HALO OPTICAL · 内部系统 · 仅供团队使用</div>
<script>try{Auth.decorate()}catch(e){}</script>
</body>
</html>
