<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Halo 登录</title>
<script src="auth.js?v=2"></script>
<style>
  :root{ --navy:#0B2447; --navy2:#0F2E5A; --gold:#D4A24C; --cream:#F5F1E8;
    --ink:#1F2937; --line:#E3DECF; --muted:#8A8678; --red:#D85A30; --ok:#1D9E75; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    background:var(--navy);color:var(--ink);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px}
  .box{background:#fff;border-radius:20px;padding:36px 28px;max-width:380px;width:100%;
    box-shadow:0 16px 50px rgba(0,0,0,.3)}
  .logo{color:var(--gold);font-size:32px;font-weight:700;letter-spacing:2px;text-align:center}
  .sub{color:var(--muted);font-size:13px;text-align:center;margin-top:6px}
  .need{margin-top:18px;text-align:center;font-size:13px;color:var(--navy);
    background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:9px}
  .out{margin-top:18px;text-align:center;font-size:13px;color:var(--ok);
    background:#E8F6EF;border:1px solid #B9E3CE;border-radius:10px;padding:9px}
  label{display:block;font-size:13px;color:var(--ink);font-weight:600;margin:24px 0 8px}
  input{width:100%;padding:14px;font-size:16px;border:1.5px solid var(--line);border-radius:12px;outline:none}
  input:focus{border-color:var(--gold)}
  .btn{width:100%;margin-top:20px;padding:15px;font-size:16px;font-weight:600;color:#fff;
    background:var(--navy);border:none;border-radius:12px;cursor:pointer}
  .btn:active{background:var(--navy2)}
  .btn[disabled]{opacity:.6}
  .msg{margin-top:14px;font-size:13px;text-align:center;min-height:18px}
  .msg.err{color:var(--red)}
  .msg.ok{color:var(--ok)}
  .foot{margin-top:22px;text-align:center;font-size:12px;color:var(--muted);line-height:1.7}
  .foot a{color:var(--gold);text-decoration:none}
  .gen{margin-top:16px;background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:12px;
    font-size:12px;word-break:break-all;line-height:1.6}
  .gen b{color:var(--navy)} .gen code{color:#854F0B}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">HALO</div>
    <div class="sub">内部系统 · 请登录</div>

    <div id="out" class="out" style="display:none">你已安全登出</div>
    <div id="need" class="need" style="display:none"></div>

    <div id="loginForm">
      <label for="pw">密码</label>
      <input id="pw" type="password" inputmode="text" placeholder="输入密码" autocomplete="off">
      <button class="btn" id="go">登录</button>
      <div id="msg" class="msg"></div>
      <div class="foot">登录后这台设备会记住 7 天。<br>公用电脑用完请点右下角“登出”，或 <a href="login.html?logout=1">在此登出</a>。</div>
    </div>

    <div id="loggedIn" style="display:none">
      <div class="msg ok" style="margin-top:26px">你已登录为 <b id="curRole"></b></div>
      <button class="btn" id="enter">进入系统</button>
      <div class="foot"><a href="login.html?logout=1">退出 / 切换账号</a></div>
    </div>

    <!-- 改密码小工具：访问 login.html?gen=新密码 时显示 -->
    <div id="genBox" class="gen" style="display:none"></div>
  </div>

<script>
  function qs(k){ return new URLSearchParams(location.search).get(k); }
  function $(id){ return document.getElementById(id); }
  var PAGES = (window.Auth && Auth.cfg && Auth.cfg.PAGES) || ["index.html","pos.html","dashboard.html"];
  function safeNext(){ var n = qs("next") || "index.html"; return PAGES.indexOf(n) >= 0 && n!=="login.html" ? n : "index.html"; }

  // 登出（?logout=1：清除后停留在登录页）
  if (qs("logout")==="1" && window.Auth){ localStorage.removeItem(Auth.cfg.KEY); }
  if (qs("out")==="1"){ $("out").style.display="block"; }

  // 改密码工具：?gen=明文密码 -> 显示哈希
  var gen = qs("gen");
  if (gen && window.Auth){
    $("loginForm").style.display="none";
    Auth.hash(gen).then(function(h){
      $("genBox").style.display="block";
      $("genBox").innerHTML = '把下面这串哈希贴进 <b>auth.js</b> 的 HASH 里（staff 或 boss 任选其一）：<br><br>密码：<code>'+gen+'</code><br>哈希：<code>'+h+'</code>';
    });
  }

  var need = qs("need"); // "staff" / "boss" / null
  if (need==="boss"){ $("need").style.display="block"; $("need").textContent="此页面仅限 老板 / HQ 登录"; }

  // 已登录 -> 显示“进入系统”
  var cur = window.Auth ? Auth.current() : null;
  if (cur && qs("logout")!=="1" && !gen && !(need==="boss" && cur.role!=="boss")){
    $("loginForm").style.display="none";
    $("loggedIn").style.display="block";
    $("curRole").textContent = (cur.role==="boss") ? "老板 / HQ" : "店员";
    $("enter").onclick=function(){ location.replace(safeNext()); };
  }

  async function attempt(){
    var msg=$("msg"), btn=$("go");
    var v=$("pw").value.trim();
    if(!window.Auth){ msg.className="msg err"; msg.textContent="登录模块没加载，请刷新页面"; return; }
    btn.disabled=true; msg.className="msg"; msg.textContent="验证中…";
    var role = await Auth.login(v);
    if(!role){ btn.disabled=false; msg.className="msg err"; msg.textContent="密码不对，再试一次"; return; }
    if(need==="boss" && role!=="boss"){
      localStorage.removeItem(Auth.cfg.KEY);
      btn.disabled=false; msg.className="msg err"; msg.textContent="这是老板专用页面，请用老板密码"; return;
    }
    msg.className="msg ok"; msg.textContent="登录成功，正在进入…";
    setTimeout(function(){ location.replace(safeNext()); }, 350);
  }
  if($("go")) $("go").onclick=attempt;
  if($("pw")) $("pw").addEventListener("keydown",function(e){ if(e.key==="Enter") attempt(); });
</script>
</body>
</html>
