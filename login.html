<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Halo 登录</title>
<style>
  :root{ --navy:#0B2447; --navy2:#0F2E5A; --gold:#D4A24C; --cream:#F5F1E8;
    --ink:#1F2937; --line:#E3DECF; --muted:#8A8678; --red:#D85A30; --ok:#1D9E75; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    background:var(--navy);color:var(--ink);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px}
  .box{background:#fff;border-radius:20px;padding:36px 28px;max-width:380px;width:100%;
    box-shadow:0 16px 50px rgba(0,0,0,.3)}
  .logo{color:var(--gold);font-size:32px;font-weight:700;letter-spacing:2px;text-align:center}
  .sub{color:var(--muted);font-size:13px;text-align:center;margin-top:6px}
  .need{margin-top:18px;text-align:center;font-size:13px;color:var(--navy);
    background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:9px}
  label{display:block;font-size:13px;color:var(--ink);font-weight:600;margin:24px 0 8px}
  input{width:100%;padding:14px;font-size:16px;border:1.5px solid var(--line);border-radius:12px;outline:none}
  input:focus{border-color:var(--gold)}
  .btn{width:100%;margin-top:20px;padding:15px;font-size:16px;font-weight:600;color:#fff;
    background:var(--navy);border:none;border-radius:12px;cursor:pointer}
  .btn:active{background:var(--navy2)}
  .msg{margin-top:14px;font-size:13px;text-align:center;min-height:18px}
  .msg.err{color:var(--red)}
  .msg.ok{color:var(--ok)}
  .foot{margin-top:22px;text-align:center;font-size:12px;color:var(--muted);line-height:1.7}
  .foot a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">HALO</div>
    <div class="sub">内部系统 · 请登录</div>
    <div id="need" class="need" style="display:none"></div>

    <div id="loginForm">
      <label for="pw">密码</label>
      <input id="pw" type="password" inputmode="text" placeholder="输入密码" autocomplete="off">
      <button class="btn" id="go">登录</button>
      <div id="msg" class="msg"></div>
      <div class="foot">登录后这台设备会记住 7 天。<br>公用电脑用完请点 <a href="login.html?logout=1">退出登录</a>。</div>
    </div>

    <div id="loggedIn" style="display:none">
      <div class="msg ok" style="margin-top:26px">你已登录为 <b id="curRole"></b></div>
      <button class="btn" id="enter">进入系统</button>
      <div class="foot"><a href="login.html?logout=1">退出 / 切换账号</a></div>
    </div>
  </div>

<script>
  // ========================================================
  //  HALO 登录设置 —— 改密码只改下面这两行
  //  注意：纯前端密码，懂技术的人查看源码能看到。够用于"挡普通人"。
  // ========================================================
  var PW_STAFF = "halo2026";      // 店员密码
  var PW_BOSS  = "haloceo2026";   // 老板 / HQ 密码
  var DAYS     = 7;               // 记住登录天数
  var PAGES    = ["index.html","pos.html","dashboard.html"]; // 允许跳转的页面白名单
  // ========================================================

  function qs(k){ return new URLSearchParams(location.search).get(k); }
  function save(role){
    localStorage.setItem("halo_auth", JSON.stringify({role:role, exp: Date.now()+DAYS*86400000}));
  }
  function current(){
    try{ var a=JSON.parse(localStorage.getItem("halo_auth")||"null");
      return (a && a.exp && Date.now()<a.exp) ? a : null; }catch(e){ return null; }
  }
  function safeNext(){
    var n = qs("next") || "index.html";
    return PAGES.indexOf(n) >= 0 ? n : "index.html";
  }

  // 退出登录
  if(qs("logout")==="1"){ localStorage.removeItem("halo_auth"); }

  var need = qs("need"); // "staff" / "boss" / null
  if(need==="boss"){
    var nEl=document.getElementById("need");
    nEl.style.display="block";
    nEl.textContent="此页面仅限 老板 / HQ 登录";
  }

  // 已经登录的情况
  var cur = current();
  if(cur && qs("logout")!=="1" && !(need==="boss" && cur.role!=="boss")){
    document.getElementById("loginForm").style.display="none";
    var li=document.getElementById("loggedIn");
    li.style.display="block";
    document.getElementById("curRole").textContent = (cur.role==="boss") ? "老板 / HQ" : "店员";
    document.getElementById("enter").onclick=function(){ location.replace(safeNext()); };
  }

  function attempt(){
    var v=document.getElementById("pw").value.trim();
    var msg=document.getElementById("msg");
    var role=null;
    if(v===PW_BOSS) role="boss";
    else if(v===PW_STAFF) role="staff";
    if(!role){ msg.className="msg err"; msg.textContent="密码不对，再试一次"; return; }
    if(need==="boss" && role!=="boss"){
      msg.className="msg err"; msg.textContent="这是老板专用页面，请用老板密码"; return;
    }
    save(role);
    msg.className="msg ok"; msg.textContent="登录成功，正在进入…";
    setTimeout(function(){ location.replace(safeNext()); }, 350);
  }
  document.getElementById("go").onclick=attempt;
  document.getElementById("pw").addEventListener("keydown",function(e){ if(e.key==="Enter") attempt(); });
</script>
</body>
</html>
