<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Halo 考勤</title>
<script src="auth.js?v=2"></script>
<script>try{Auth.guard("staff")}catch(e){location.replace("login.html")}</script>
<style>
  :root{--navy:#0B2447;--navy2:#0F2E5A;--gold:#D4A24C;--cream:#F5F1E8;
    --ink:#1F2937;--line:#E3DECF;--muted:#8A8678;--ok:#1D9E75;--red:#D85A30;--blue:#185FA5;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    background:var(--cream);color:var(--ink);line-height:1.5;padding-bottom:90px}
  header{background:var(--navy);padding:16px 20px;display:flex;align-items:center;gap:10px}
  header a{color:#9DB4D4;text-decoration:none;font-size:13px}
  header .ttl{color:var(--gold);font-size:17px;font-weight:700}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
  label:first-child{margin-top:0}
  input,select,textarea{width:100%;padding:12px;font-size:15px;border:1.5px solid var(--line);
    border-radius:10px;outline:none;font-family:inherit;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{border-color:var(--gold)}
  .row2{display:flex;gap:10px}.row2>div{flex:1}
  .idshow{font-size:13px;color:var(--muted);margin-top:12px}
  .idshow b{color:var(--navy)}
  .tabs{display:flex;gap:8px;margin:4px 0 16px}
  .tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit}
  .tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .monthnav button{background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font-size:16px;cursor:pointer}
  .monthnav .m{font-size:16px;font-weight:700;color:var(--navy)}
  .quota{font-size:14px;margin-bottom:10px}.quota b{font-size:16px}.quota.over b{color:var(--red)}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal .wd{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
  .day{position:relative;aspect-ratio:1/1;border:1px solid var(--line);border-radius:9px;background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;user-select:none}
  .day.blank{border:none;background:none;cursor:default}
  .day.clash{background:#FDEEE8;border-color:#F0C4B4}
  .day.sel{background:var(--gold);color:var(--navy);font-weight:700;border-color:var(--gold)}
  .day.today{box-shadow:inset 0 0 0 2px var(--navy)}
  .day .badge{position:absolute;top:2px;right:3px;font-size:10px;color:#fff;background:var(--red);
    border-radius:8px;min-width:14px;height:14px;line-height:14px;text-align:center;padding:0 3px}
  .hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
  .warn{background:#FBF6EC;border:1px solid var(--gold);color:#854F0B;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px;display:none}
  .banner{background:#FCE9E1;border:1px solid var(--red);color:#9A3412;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px;display:none}
  .btn{width:100%;padding:15px;font-size:16px;font-weight:700;color:#fff;background:var(--navy);
    border:none;border-radius:12px;cursor:pointer;margin-top:6px}
  .btn:active{background:var(--navy2)}.btn[disabled]{opacity:.55}
  .msg{text-align:center;font-size:14px;margin-top:12px;min-height:20px}
  .msg.ok{color:var(--ok)}.msg.err{color:var(--red)}
  .hide{display:none}
</style>
</head>
<body>
<header>
  <a href="index.html">‹ 首页</a>
  <div class="ttl">考勤 · 排休 / 请假</div>
</header>

<div class="wrap">
  <div class="banner" id="loadErr">⚠️ 名单载入失败，请下拉刷新或稍后再试。</div>

  <!-- 身份：选店 → 选名字（身份自动） -->
  <div class="card">
    <div class="row2">
      <div>
        <label>分店</label>
        <select id="fStore" onchange="onStoreChange()"></select>
      </div>
      <div>
        <label>姓名</label>
        <select id="fName" onchange="onNameChange()"></select>
      </div>
    </div>
    <div class="idshow" id="idShow">身份：—</div>
  </div>

  <!-- 排休 / 请假 切换 -->
  <div class="tabs">
    <button id="tabRest" class="on" onclick="setTab('rest',this)">排休</button>
    <button id="tabLeave" onclick="setTab('leave',this)">请假</button>
  </div>

  <!-- 排休 -->
  <div id="paneRest">
    <div class="card">
      <div class="monthnav">
        <button onclick="shiftMonth(-1)">‹</button>
        <div class="m" id="mLabel"></div>
        <button onclick="shiftMonth(1)">›</button>
      </div>
      <div class="quota" id="quota">本月已选 <b>0</b> / 6 天</div>
      <div class="cal" id="cal"></div>
      <div class="warn" id="coverWarn"></div>
      <div class="hint">点想休的日子（金色 = 你已选）。<b>淡红底 + 右上角红数字</b> = 这天你店已有同事申请休 / 请假；点下去会显示是谁。系统只提醒、不硬挡。老员工每月 6 天 / 新人 4 天。</div>
    </div>
    <button class="btn" id="submitRest" onclick="submitRest()">提交本月排休</button>
    <div class="msg" id="restMsg"></div>
  </div>

  <!-- 请假 -->
  <div id="paneLeave" class="hide">
    <div class="card">
      <label>请假类型</label>
      <select id="lType"></select>
      <div class="row2">
        <div><label>开始日期</label><input type="date" id="lFrom"></div>
        <div><label>结束日期（同一天可不填）</label><input type="date" id="lTo"></div>
      </div>
      <label>原因</label>
      <textarea id="lReason" rows="3" placeholder="简单说明，例如：回乡 / 看医生"></textarea>
    </div>
    <button class="btn" id="submitLeave" onclick="submitLeave()">提交请假（待 HQ 审批）</button>
    <div class="msg" id="leaveMsg"></div>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxUd2USgw1asp4iBKKUS6sznT45r0RcHdwyfMk52zh5ss85r4ij-yqwJtBQi8-aYgfXkw/exec";
const STORES = ["Iconic Point","Juru One City","Bukit Minyak","Icon City","Machang Bubok","Kulim","Kepong","Melaka","Kulai"];
const FLOAT = "机动";
const LEAVE_TYPES = ["年假 Annual","病假 Medical","紧急事假 Emergency","无薪假 Unpaid","其他 Other"];
const WD = ["日","一","二","三","四","五","六"];
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");

let roster = [];
let identity = "老员工";
let tab = "rest";
let curMonth = thisMonth();
let selected = new Set();   // 我这个月选的休假日
let records = [];           // 该月全部考勤记录

function thisMonth(){ const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function quotaN(){ return identity==="新人" ? 4 : 6; }

/* ---- 初始化 ---- */
LEAVE_TYPES.forEach(function(s){ const o=document.createElement("option"); o.value=s; o.textContent=s; $("lType").appendChild(o); });
$("lFrom").value=todayStr();

fetch(SCRIPT_URL+"?roster=1&_="+Date.now())
  .then(r=>r.json())
  .then(function(res){
    roster=(res&&res.roster)?res.roster:[];
    buildStores();
    restoreProfile();
    fetchMonth();
  })
  .catch(function(){ $("loadErr").style.display="block"; });

function buildStores(){
  const present=[];
  STORES.concat([FLOAT]).forEach(function(s){
    if(roster.some(function(p){return p.store===s;})) present.push(s);
  });
  $("fStore").innerHTML="";
  present.forEach(function(s){ const o=document.createElement("option"); o.value=s; o.textContent=s; $("fStore").appendChild(o); });
}
function namesIn(store){ return roster.filter(function(p){return p.store===store;}); }
function buildNames(){
  const store=$("fStore").value;
  $("fName").innerHTML="";
  namesIn(store).forEach(function(p){ const o=document.createElement("option"); o.value=p.name; o.textContent=p.name; $("fName").appendChild(o); });
}
function curPerson(){ const n=$("fName").value; return roster.filter(function(p){return p.name===n && p.store===$("fStore").value;})[0]; }
function applyIdentity(){
  const p=curPerson();
  identity = (p&&p.identity) ? p.identity : "老员工";
  $("idShow").innerHTML="身份：<b>"+identity+"</b>（每月休 "+quotaN()+" 天）";
}

function restoreProfile(){
  try{
    const pf=JSON.parse(localStorage.getItem("halo_att_profile")||"null");
    if(pf && pf.store && Array.prototype.some.call($("fStore").options,function(o){return o.value===pf.store;})){
      $("fStore").value=pf.store;
    }
  }catch(e){}
  buildNames();
  try{
    const pf=JSON.parse(localStorage.getItem("halo_att_profile")||"null");
    if(pf && pf.name && Array.prototype.some.call($("fName").options,function(o){return o.value===pf.name;})){
      $("fName").value=pf.name;
    }
  }catch(e){}
  applyIdentity();
}
function saveProfile(){ localStorage.setItem("halo_att_profile", JSON.stringify({store:$("fStore").value, name:$("fName").value})); }

function onStoreChange(){ buildNames(); applyIdentity(); saveProfile(); recompute(); renderQuota(); renderCal(); }
function onNameChange(){ applyIdentity(); saveProfile(); recompute(); renderQuota(); renderCal(); }

function setTab(t,btn){
  tab=t;
  document.querySelectorAll(".tabs button").forEach(function(b){b.classList.remove("on");});
  if(btn)btn.classList.add("on");
  $("paneRest").classList.toggle("hide", t!=="rest");
  $("paneLeave").classList.toggle("hide", t!=="leave");
}

/* ---- 月份 / 读取 ---- */
function shiftMonth(d){
  let a=curMonth.split("-").map(Number),y=a[0],m=a[1];
  m+=d; if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  curMonth=y+"-"+pad(m);
  fetchMonth();
}
function recompute(){
  selected=new Set();
  const me=$("fName").value, st=$("fStore").value;
  records.forEach(function(r){ if(r.kind==="rest" && r.name.trim()===me && r.store===st) selected.add(String(r.date).slice(0,10)); });
}
function fetchMonth(){
  $("mLabel").textContent=curMonth;
  fetch(SCRIPT_URL+"?month="+curMonth+"&_="+Date.now(),{cache:"no-store"})
    .then(r=>r.json())
    .then(function(res){ records=(res&&res.records)?res.records:[]; recompute(); renderQuota(); renderCal(); })
    .catch(function(){ records=[]; recompute(); renderQuota(); renderCal(); });
}

/* ---- 渲染 ---- */
function expandDates(label){
  label=String(label||"").trim();
  const parts=label.split("~").map(function(s){return s.trim().slice(0,10);});
  const s=parts[0]; let e=parts[1]||parts[0];
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s)) return [];
  if(!/^\d{4}-\d{2}-\d{2}$/.test(e)) e=s;
  const sa=s.split("-").map(Number), ea=e.split("-").map(Number);
  let y=sa[0],m=sa[1],d=sa[2]; const ey=ea[0],em=ea[1],ed=ea[2];
  const out=[]; let g=0;
  while(g++<400){ out.push(y+"-"+pad(m)+"-"+pad(d)); if(y===ey&&m===em&&d===ed) break;
    d++; const dim=new Date(y,m,0).getDate(); if(d>dim){d=1;m++;if(m>12){m=1;y++;}}
    if(y>ey||(y===ey&&m>em)||(y===ey&&m===em&&d>ed)) break; }
  return out;
}
// 同分行、除自己以外，当天已申请休 / 请假的人（排休+请假都算）
function othersOffList(dateStr){
  const me=$("fName").value, st=$("fStore").value, out=[];
  records.forEach(function(r){
    if(r.store!==st || r.name.trim()===me) return;
    if(r.kind==="rest" && String(r.date).slice(0,10)===dateStr) out.push(r.name.trim());
    else if(r.kind==="leave" && expandDates(r.date).indexOf(dateStr)>=0) out.push(r.name.trim());
  });
  return out.filter(function(v,i){return out.indexOf(v)===i;});
}
function renderQuota(){
  const n=quotaN(), c=selected.size;
  const q=$("quota"); q.classList.toggle("over", c>n);
  q.innerHTML="本月已选 <b>"+c+"</b> / "+n+" 天"+(c>n?"（已超出本月配额）":"");
}
function renderCal(){
  const a=curMonth.split("-").map(Number),y=a[0],m=a[1];
  const first=new Date(y,m-1,1).getDay();
  const dim=new Date(y,m,0).getDate();
  let html="";
  WD.forEach(function(w){html+='<div class="wd">'+w+'</div>';});
  for(let i=0;i<first;i++) html+='<div class="day blank"></div>';
  for(let d=1;d<=dim;d++){
    const ds=curMonth+"-"+pad(d);
    const sel=selected.has(ds);
    const off=othersOffList(ds).length;
    const isToday=ds===todayStr();
    html+='<div class="day'+(sel?" sel":"")+(off>0?" clash":"")+(isToday?" today":"")+'" onclick="toggleDay(\''+ds+'\')">'
        + d + (off>0?'<span class="badge">'+off+'</span>':'') + '</div>';
  }
  $("cal").innerHTML=html;
}
function toggleDay(ds){
  if(selected.has(ds)) selected.delete(ds);
  else{
    selected.add(ds);
    const others=othersOffList(ds);
    const w=$("coverWarn");
    if(others.length>0){ w.style.display="block"; w.innerHTML="⚠️ <b>"+ds+"</b>：你店当天已有 <b>"+others.length+" 人</b>申请休 —— "+others.join("、")+"。当天可能没人看店，请斟酌。"; }
    else w.style.display="none";
  }
  renderQuota(); renderCal();
}

/* ---- 提交 ---- */
function need(){
  const name=$("fName").value, store=$("fStore").value;
  if(!name){ alert("请先选姓名（先选分店，名字会自动出现）"); return null; }
  return {name:name, store:store, identity:identity};
}
function submitRest(){
  const base=need(); if(!base) return;
  const btn=$("submitRest"), msg=$("restMsg");
  btn.disabled=true; msg.className="msg"; msg.textContent="提交中…";
  fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(Object.assign({kind:"rest",month:curMonth,days:Array.from(selected)},base))})
    .then(r=>r.json())
    .then(function(res){ btn.disabled=false;
      if(res&&res.ok){ msg.className="msg ok"; msg.textContent="✅ 已提交本月排休（"+res.count+" 天）"; fetchMonth(); }
      else { msg.className="msg err"; msg.textContent="提交失败："+((res&&res.error)||"未知错误"); } })
    .catch(function(){ btn.disabled=false; msg.className="msg err"; msg.textContent="网络错误，稍后再试"; });
}
function submitLeave(){
  const base=need(); if(!base) return;
  const from=$("lFrom").value, to=$("lTo").value||from, reason=$("lReason").value.trim();
  if(!from){ alert("请选开始日期"); return; }
  const btn=$("submitLeave"), msg=$("leaveMsg");
  btn.disabled=true; msg.className="msg"; msg.textContent="提交中…";
  fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(Object.assign({kind:"leave",leaveType:$("lType").value,from:from,to:to,reason:reason},base))})
    .then(r=>r.json())
    .then(function(res){ btn.disabled=false;
      if(res&&res.ok){ msg.className="msg ok"; msg.textContent="✅ 已提交，待 HQ 审批"; $("lReason").value=""; }
      else { msg.className="msg err"; msg.textContent="提交失败："+((res&&res.error)||"未知错误"); } })
    .catch(function(){ btn.disabled=false; msg.className="msg err"; msg.textContent="网络错误，稍后再试"; });
}
</script>
<script>try{Auth.decorate()}catch(e){}</script>
</body>
</html>
